<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>차와 함께 오래</title>
</head>



<body>
    <header>
        <h1>차와 함께 오래</h1>
        <p>내 차를 오래 건강하게 관리할 수 있도록 도와드립니다.</p>
    </header>

    <h2>서비스 소개</h2>
    <h3>내 차의 상태를 쉽게 확인하고 관리하세요</h3>


    <h2>주요 기능</h2>
    <ul>
        <li>
            <h3>관리 일정 한눈에 보기</h3>
            <p>엔진오일과 소모품 등 내 차의 관리 일정을 확인합니다.</p>
        </li>

        <li>
            <h3>관리 시기 알림</h3>
            <p>차량 관리가 필요한 시기를 놓치지 않도록 알려드립니다.</p>
        </li>

        <li>
            <h3>차량 관리 기록</h3>
            <p>언제 무엇을 관리했는지 기록하여 차량 상태를 쉽게 확인합니다.</p>
        </li>
    </ul>

</body>

</html>
